<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撥貸金額工具</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e2e5ea;--ac:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--tx:#e6e8ec;--mu:#9aa3b2;--bd:#2c323d;--ac:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px}
h1{font-size:24px;margin:0 0 6px}
p.sub{color:var(--mu);margin:0 0 24px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--ac);outline:none}
a.card b{display:block;font-size:17px;color:var(--ac);margin-bottom:4px}
a.card span{color:var(--mu);font-size:14px}
footer{color:var(--mu);font-size:13px;margin-top:28px}
</style></head><body><main>
<h1>信貸撥貸金額工具</h1>
<p class="sub">輸入客戶條件取得參考撥貸金額。資料只在你的瀏覽器內計算，不會上傳。</p>
<div class="grid">
 <a class="card" href="predictor.html"><b>撥貸金額預測工具</b><span>單筆預測金額與等級；上傳 CSV 批次預測並下載結果。</span></a>
 <a class="card" href="tree.html"><b>撥貸金額（決策樹判斷）</b><span>單筆預測，並顯示決策樹的判斷路徑。</span></a>
</div>
<footer>預測結果僅供參考，實際核貸以審核結果為準。</footer>
</main></body></html>
