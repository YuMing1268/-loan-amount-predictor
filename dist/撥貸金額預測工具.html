<h1>撥貸金額預測工具</h1>
<p class="sub" id="sub"></p>
<div class="grid">
<div class="card"><h2>單筆輸入（KYC 後）</h2><div id="form"></div>
<button id="go">預測</button><button class="g" id="reset">範例／重設</button></div>
<div class="card"><h2>預測結果</h2><div id="out"><span class="sub">請輸入條件後按「預測」。</span></div></div>
</div>
<div class="card"><h2>批次預測（每日名單上傳 CSV）</h2>
<input type="file" id="file" accept=".csv,text/csv">

<div id="bmsg" class="msg"></div><div class="tw" id="btab"></div>
<button id="dl" style="display:none">下載預測結果 CSV</button></div>
<p class="note">預測值為依歷史資料推估的參考額度，供與主管討論行銷細節使用；實際撥貸仍取決於收入、徵信與風險政策。金額單位沿用原資料（假設為萬元）。</p>

$("reset").onclick=()=>{for(const g in CATS)$("c_"+g).value=g=="行業"?"行業屬性C":"";NUM.forEach(([k])=>$("n_"+k).value=({DBR:12,無擔保總餘額:20,循環比:10})[k]||0);safeRun()};
let outCSV="";
$("file").onchange=async e=>{const file=e.target.files[0];if(!file)return;$("btab").innerHTML="";$("dl").style.display="none";$("bmsg").innerHTML="";
 const B=batchPredict(decode(await file.arrayBuffer()));if(B.error){$("bmsg").innerHTML=`<span class="err">${esc(B.error)}</span>`;return}
 outCSV=B.csv;
 $("bmsg").textContent=`已預測 ${B.res.length.toLocaleString()} 筆　等級分布：低 ${B.cnt.低}／中 ${B.cnt.中}／高 ${B.cnt.高}`+(B.mae!==null?`　MAE = ${r1(B.mae)}`:"")+(B.neg.length?`
⚠ 有 ${B.neg.length} 筆數值超出範圍（第 ${B.neg.slice(0,10).join("、")}${B.neg.length>10?"…":""} 列）：數值欄位不得小於 0，DBR 不得大於 22，請修正來源資料。`:"");
 $("bmsg").style.whiteSpace="pre-line";
 const show=["撥貸金額"].filter(k=>B.H.includes(k)).concat(["DBR","無擔保總餘額"]);
 $("btab").innerHTML="<table><tr>"+show.concat(ADD).map(k=>`<th>${esc(k)}</th>`).join("")+"</tr>"+B.rows.slice(0,30).map((o,i)=>"<tr>"+show.map(k=>`<td>${esc(o[k])}</td>`).join("")+B.res[i].map(v=>`<td>${esc(v)}</td>`).join("")+"</tr>").join("")+"</table>"+(B.rows.length>30?'<p class="note">僅顯示前 30 筆，完整結果請下載。</p>':"");
 $("dl").style.display="inline-block"};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([outCSV],{type:"text/csv;charset=utf-8"}));a.download=outName(new Date());a.click()};
}
</script></body></html>
